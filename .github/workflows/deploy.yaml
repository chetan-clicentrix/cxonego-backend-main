name: Optimized CI/CD Pipeline - Production Deployment

on:
  push:
    branches:
      - Production  
  workflow_dispatch:  # Allow manual trigger

env:
  PROJECT_NAME: cxonego-backend-main
  NODE_VERSION: '18'
  DEPLOY_PATH: /root/cxonego/cxonego-backend-main

jobs:
  build-and-deploy:
    name: Build on GitHub & Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
   
      - name: 🧾 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      # ============================================
      # STEP 3: Cache Dependencies for Faster Builds
      # ============================================
      - name: ♻️ Cache Yarn Dependencies
        id: cache-yarn-deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/cache
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-


      - name: 📦 Install Dependencies
        if: steps.cache-yarn-deps.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --prefer-offline

   
      - name: 🏗️ Build TypeScript Project
        run: |
          echo "Building project..."
          yarn run build
          echo "Build completed successfully!"

      - name: 📂 Verify Build Output
        run: |
          echo "Checking build directory..."
          ls -lah build/
          echo "Build size:"
          du -sh build/

     
      - name: 📦 Create Deployment Package
        run: |
          echo "Creating deployment package..."
          mkdir -p deploy-package
          
          # Copy only necessary files
          cp -r build deploy-package/
          cp package.json deploy-package/
          cp yarn.lock deploy-package/
          cp ecosystem.config.js deploy-package/
          
          # Copy .env.example if exists (not .env for security)
          [ -f .env.example ] && cp .env.example deploy-package/ || true
          
          echo "Deployment package created!"
          ls -lah deploy-package/


    
      - name: 📥 Install Production Dependencies
        run: |
          cd deploy-package
          yarn install --frozen-lockfile --production --prefer-offline
          echo "Production dependencies installed!"

      # ============================================
      # Deploy to Server via Rsync
      # ============================================
      - name: 🚀 Deploy to Production Server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.env' --exclude='.git' --exclude='*.log'
          path: deploy-package/
          remote_path: ${{ env.DEPLOY_PATH }}
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.USERNAME }}
          remote_password: ${{ secrets.PASSWORD }}

      # ============================================
      #  Restart Application with PM2
      # ============================================
      - name: ⚙️ Restart Application with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -e  # Exit on error
            
            echo "🔍 Navigating to project directory..."
            cd ${{ env.DEPLOY_PATH }}
            
            echo "📋 Checking PM2 status..."
            pm2 describe ${{ env.PROJECT_NAME }} > /dev/null 2>&1
            APP_EXISTS=$?
            
            if [ $APP_EXISTS -eq 0 ]; then
              echo "🔄 Application exists, performing graceful reload..."
              pm2 reload ${{ env.PROJECT_NAME }} --update-env
            else
              echo "🆕 Starting new application..."
              pm2 start ecosystem.config.js --env production
            fi
            
            echo "💾 Saving PM2 process list..."
            pm2 save --force
            
            echo "📊 Current PM2 status:"
            pm2 list
            
            echo "✅ Deployment completed successfully!"
